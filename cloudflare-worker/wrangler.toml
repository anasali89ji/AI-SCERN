name = "aiscern-image-ensemble"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# IMG-WORKER-1 — worker-availability policy (non-secret, safe as a plain var).
#   both = abort image detection unless BOTH the CV worker and the GPU Space respond
#   any  = abort only when NEITHER responds (default; missing one is flagged in
#          degraded_signals instead of failing the scan)
#   none = never abort (ensemble-only results allowed)
[vars]
IMAGE_WORKERS_REQUIRED = "any"

# Vars set via `wrangler secret put <NAME>` — never committed here:
#   HUGGINGFACE_API_TOKEN   — HF Inference API token
#   GEMINI_API_KEY          — Google AI Studio key (primary)
#   GEMINI_API_KEY_2        — Google AI Studio key (secondary fallback, optional)
#   PYTHON_WORKER_URL       — DigitalOcean signal-worker base URL (REQUIRED)
#   HF_GPU_WORKER_URL       — HF ZeroGPU Space base URL (REQUIRED)
#   WORKER_SHARED_SECRET    — must match INTERNAL_API_SECRET checked by Vercel's
#                             /api/detect/image/finalize route, and must be sent
#                             BY Vercel when it calls this worker's /analyze route
#   CALLBACK_BASE_URL       — https://aiscern.com (or preview URL) — where this
#                             worker POSTs the finished result back to

[observability]
enabled = true
