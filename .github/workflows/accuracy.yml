name: Accuracy Smoke
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
jobs:
  accuracy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: signal-worker/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install signal-worker Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -q -r signal-worker/requirements.txt
          pip install -q pytest httpx
      - name: Run accuracy smoke test
        run: make accuracy-smoke
